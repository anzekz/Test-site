<body>
  <header>
    <h1>Frequency</h1>
    <p>A listening bar for people who miss needle drops</p>
  </header>

  <main>
    <section id="visualizer-section">
      <canvas id="visualizer"></canvas>
      <button id="playBtn">Play a track</button>
    </section>

    <section id="controls">
      <label>Bass <input type="range" id="bass"></label>
      <label>Mid <input type="range" id="mid"></label>
      <label>Treble <input type="range" id="treble"></label>
    </section>
  </main>
</body>
